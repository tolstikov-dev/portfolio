<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <script>
      // SPA-fallback для GitHub Pages: чистые URL страниц проектов
      // (/portfolio/memiqa, /portfolio/lowcode, /portfolio/site, /portfolio/docmind) физически не существуют,
      // поэтому Pages отдаёт эту страницу со статусом 404. Сохраняем путь
      // и уходим на корень сайта — index.html восстановит URL через
      // history.replaceState (см. public/spa-restore.js).
      // Слаги в regex ниже дублируют src/data/project-routes.json (источник
      // истины) — синхронность проверяется smoke-тестом (scripts/smoke.mjs).
      (function () {
        var m = window.location.pathname.match(/^(.*\/)(memiqa|lowcode|site|docmind)\/?$/);
        if (!m) return;
        try {
          sessionStorage.setItem('spa-redirect', m[1] + m[2] + window.location.search + window.location.hash);
        } catch (e) {}
        window.location.replace(m[1]);
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/portfolio/favicon.svg" />
    <title>404 — страница не найдена</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0d13;
        color: #f5f1e8;
        font-family: 'Segoe UI', Arial, sans-serif;
      }
      .card { text-align: center; padding: 2rem; }
      .code { font-size: 5rem; font-weight: 800; color: #e2b15c; margin: 0 0 0.5rem; }
      p { color: #9aa0b0; }
      a { color: #e2b15c; text-decoration: none; }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div class="card">
      <p class="code">404</p>
      <p>Страница не найдена · Page not found</p>
      <p><a href="/portfolio/">← На главную / Home</a></p>
    </div>
  </body>
</html>
