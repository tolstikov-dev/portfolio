    <!-- CSP: без 'unsafe-inline' для script-src — оба boot-скрипта и загрузчик
         Яндекс.Метрики вынесены в public/. Домены mc.yandex.ru / yastatic.net /
         mc.webvisor.* — по официальному списку для Метрики с Вебвизором:
         https://yandex.ru/support/metrica/code/install-counter-csp.html -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://mc.yandex.ru https://yastatic.net https://mc.webvisor.com https://mc.webvisor.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://mc.yandex.ru; font-src 'self'; connect-src 'self' https://api.web3forms.com https://mc.yandex.ru wss://mc.yandex.ru https://mc.webvisor.com https://mc.webvisor.org; child-src blob: https://mc.yandex.ru; frame-src blob: https://mc.yandex.ru https://mc.webvisor.com https://mc.webvisor.org; manifest-src 'self'; object-src 'none'; base-uri 'self'" />
    <!-- Тема до первой отрисовки (без FOUC): localStorage → prefers-color-scheme → dark.
         Логика должна совпадать с initialTheme() в src/theme-provider.tsx -->
    <script src="theme-init.js"></script>
    <!-- Восстановление чистого URL после SPA-fallback из 404.html (GitHub Pages):
         404.html сохраняет запрошенный путь в sessionStorage и редиректит на корень,
         здесь возвращаем его в адресную строку до загрузки React. -->
    <script src="spa-restore.js"></script>
    <!-- Яндекс.Метрика: внешний загрузчик (без inline из-за CSP), defer —
         не блокирует рендер; сам счётчик активен только на продовом домене
         и только после явного согласия в cookie-баннере (152-ФЗ) -->
    <script src="metrika-init.js" defer></script>
